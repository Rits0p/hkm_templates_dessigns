<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harikrushna Multimedia Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar {
      position: fixed;
      top: 20px;
      left: 5%;
      right: 5%;
      z-index: 1000;
      padding: 0.8rem 2.5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 100px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .navbar.scrolled {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      background: rgba(29, 53, 87, 0.8);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-container {
      display: flex !important;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      z-index: 1100;
    }

    .nav-logo {
      height: 45px;
      width: auto;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .logo-container:hover .nav-logo {
      transform: scale(1.05);
      filter: contrast(1.1) saturate(1.1);
    }

    .logo-text {
      font-family: 'Oswald', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a:not(.nav-cta) {
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      transition: 0.3s;
    }

    .nav-links a:not(.nav-cta)::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary-red);
      transition: 0.3s;
    }

    .nav-links a:not(.nav-cta):hover::after {
      width: 100%;
    }

    .nav-cta {
      background: linear-gradient(135deg, #ff0000 0%, #b30000 100%);
      color: white !important;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
      transition: all 0.3s ease;
      border: 2px solid transparent;
      margin-left: 10px;
    }

    .nav-cta:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.6);
      background: #ffffff;
      color: var(--primary-red) !important;
      border: 2px solid var(--primary-red);
    }

    /* Hamburger Menu */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1200;
      padding: 0;
    }

    .menu-toggle .bar {
      width: 100%;
      height: 3px;
      background-color: var(--white);
      border-radius: 10px;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @media (max-width: 1280px) {
      .menu-toggle {
        display: flex;
      }

      .navbar {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) !important;
        background: rgba(29, 53, 87, 0.95) !important;
        border-radius: 100px !important;
        padding: 10px 25px !important;
        width: 90% !important;
        left: 5% !important;
      }

      .nav-links {
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: calc(100% + 15px);
        left: 0;
        right: 0;
        background: rgba(10, 10, 12, 0.98);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 40px 0;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-20px) scale(0.95);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        pointer-events: none;
      }

      .navbar.mobile-menu-open .nav-links {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: all;
      }

      .navbar.mobile-menu-open .bar:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }

      .navbar.mobile-menu-open .bar:nth-child(2) {
        opacity: 0;
        transform: translateX(-20px);
      }

      .navbar.mobile-menu-open .bar:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }

      .nav-links a:not(.nav-cta) {
        font-size: 1.1rem !important;
        padding: 12px 0;
        width: 100%;
        text-align: center;
        letter-spacing: 2px;
      }

      .nav-links a:not(.nav-cta)::after {
        display: none;
      }

      .nav-links a:active {
        background: rgba(255, 255, 255, 0.05);
        color: var(--primary-red);
      }

      .nav-cta {
        margin: 15px auto 0 !important;
        width: 80% !important;
        text-align: center;
        padding: 15px 0 !important;
      }

      .logo-text {
        display: none;
      }
    }
    </style>
</head>
<body>
    <nav class="navbar">
    <a href="Untitled-1.html" class="logo-container">
      <img src="logo.png" alt="Harikrushna Logo" class="nav-logo">
      <!-- <span class="logo-text">Harikrushna</span> -->
    </a>

    <button class="menu-toggle" aria-label="Toggle menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="nav-links">
      <a href="#" class="nav-item">Home</a>
      <a href="#" class="nav-item">About</a>
      <a href="#" class="nav-item">Course</a>
      <a href="#" class="nav-item">Event</a>
      <a href="#" class="nav-item">Portfolios</a>
      <a href="#" class="nav-item">Contact</a>
      <a href="#" class="nav-cta">Get In Touch</a>
    </div>
  </nav>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
    const navbar = document.querySelector('.navbar');

    if (menuToggle) {
      menuToggle.addEventListener('click', () => {
        navbar.classList.toggle('mobile-menu-open');
      });

      // Close menu when clicking links
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          navbar.classList.remove('mobile-menu-open');
        });
      });
    }
    </script>
</body>
</html>
